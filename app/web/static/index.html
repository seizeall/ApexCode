<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ApexCode</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">A</span><div><strong>ApexCode</strong><small>本地开发工作台</small></div></div>
      <div class="top-actions"><span id="connection" class="connection"><i></i>检查配置中</span><button id="new-session" class="button ghost">新建会话</button></div>
    </header>
    <main class="layout">
      <aside class="sidebar panel">
        <div class="panel-heading"><span>会话</span><button id="new-session-side" class="icon-button" title="新建会话">＋</button></div>
        <div id="sessions" class="session-list"></div>
        <div class="sidebar-foot"><span class="status-dot"></span><span id="workspace-label">工作区加载中</span></div>
      </aside>
      <section class="conversation">
        <div class="conversation-head"><div><span class="eyebrow">APEXCODE / WORKSPACE</span><h1>让 Agent 动手解决问题</h1><p class="head-note">从需求到验证，所有操作都在当前工作区完成。</p></div><span id="run-status" class="status-pill idle">待命</span></div>
        <div id="timeline" class="timeline"><div class="welcome"><div class="welcome-icon">⌘</div><h2>从一个真实任务开始</h2><p>描述你希望完成的编程工作，Agent 会先检查工作区，再请求必要的操作确认。</p><div class="suggestions"><button data-prompt="检查当前项目结构，并告诉我最值得先修复的问题">检查项目结构</button><button data-prompt="搜索项目中所有 TODO，并整理成清单">整理 TODO</button><button data-prompt="为当前项目补充一个最小的自动化测试">补充测试</button></div></div></div>
        <form id="composer" class="composer"><textarea id="prompt" rows="2" placeholder="描述一个编程任务，例如：找出登录接口的错误处理问题并修复它"></textarea><div class="composer-foot"><div><div class="mode-switch" role="group" aria-label="运行模式"><button type="button" class="mode-option" data-mode="full"><span class="mode-mark">⚡</span>完全</button><button type="button" class="mode-option active" data-mode="ask"><span class="mode-mark">?</span>询问</button><button type="button" class="mode-option" data-mode="plan"><span class="mode-mark">≡</span>计划</button></div><span id="mode-help" class="mode-help">先确认需求，再决定下一步</span></div><button class="button primary" type="submit"><span>开始任务</span><span class="send-icon">↗</span></button></div></form>
      </section>
      <aside class="inspector panel">
        <div class="panel-heading"><span>工作区</span><button id="refresh-tree" class="icon-button" title="刷新文件树">↻</button></div>
        <div class="workspace-path" id="workspace-path">加载中</div>
        <div id="file-tree" class="file-tree"></div>
        <div class="inspector-section"><div class="section-label">运行记录</div><div id="run-log" class="run-log"><div class="muted">暂无运行记录</div></div></div>
      </aside>
    </main>
  </div>
  <div id="approval-modal" class="modal-backdrop hidden"><div class="modal"><div class="modal-kicker">需要你的确认</div><h2 id="approval-title">即将执行操作</h2><pre id="approval-detail"></pre><div class="modal-actions"><button id="approval-deny" class="button ghost">拒绝</button><button id="approval-allow" class="button primary">允许一次</button></div></div></div>
  <script src="/static/app.js"></script>
</body>
</html>
